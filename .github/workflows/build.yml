name: build

on:
  push:
    branches: [main, codex/sync-open-grok-codex]
  pull_request:
    branches: [main, codex/sync-open-grok-codex]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast validation for pull requests and pushes: workspace check plus the
  # test suites that are deterministic on clean runners. The shell suite is
  # excluded here — it carries environment-sensitive tests (real $GROK_HOME,
  # deep-stack, timing) that need a curated harness.
  test:
    name: check-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc 29.3
        run: |
          curl -sSfL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d "$HOME/protoc"
          echo "PROTOC=$HOME/protoc/bin/protoc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # Port hard constraints (docs/codex-subscription-port-spec.md §2.1):
      # no source-repo naming may leak into the tree; docs quoting the
      # constraint and this workflow are the only allowed mentions.
      - name: Forbidden-naming guard
        run: |
          if git grep -iE 'opengrok|open-grok' -- ':!docs/' ':!.github/workflows/build.yml'; then
            echo "forbidden source-repo naming found" >&2
            exit 1
          fi

      # The v8 crate keeps its prebuilt static library in the build OUT_DIR;
      # a restored cache can carry the build fingerprint without the archive,
      # which then fails linking ("could not find native static library
      # rusty_v8"). Evicting v8's artifacts makes the build script re-fetch
      # the archive deterministically at a small cost.
      - name: Evict cached v8 build output
        run: cargo clean -p v8 || true

      - name: Workspace check
        run: cargo check --locked --workspace

      - name: Core test suites
        run: |
          cargo test --locked \
            -p xai-grok-sampling-types \
            -p xai-grok-sampler \
            -p xai-chat-state \
            -p xai-grok-code-mode-protocol \
            -p xai-grok-code-mode \
            -p xai-grok-pager-render

      # The shell/pager/tools suites carry environment-sensitive tests that
      # need a curated harness, but their #[cfg(test)] code must at least
      # keep compiling — `cargo check --workspace` alone never builds it.
      - name: Compile remaining test suites (no run)
        run: |
          cargo test --locked --no-run \
            -p xai-grok-shell \
            -p xai-grok-tools \
            -p xai-grok-pager

  build:
    name: ${{ matrix.name }}
    # Release artifacts only for pushes and manual runs; PRs get the test job.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            # macos-14 is scheduled for removal on 2026-11-02.
            runner: macos-15
            protoc: protoc-29.3-osx-aarch_64.zip
          - name: linux-x86_64
            runner: ubuntu-22.04
            protoc: protoc-29.3-linux-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      # Same protoc release the repo's dotslash wrapper (bin/protoc) pins.
      - name: Install protoc 29.3
        run: |
          curl -sSfL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${{ matrix.protoc }}"
          unzip -q /tmp/protoc.zip -d "$HOME/protoc"
          echo "PROTOC=$HOME/protoc/bin/protoc" >> "$GITHUB_ENV"

      # rustup picks up rust-toolchain.toml (1.94.0 + pinned targets) on the
      # first cargo invocation; no explicit toolchain action needed.
      - uses: Swatinem/rust-cache@v2

      - name: Build TUI (release)
        run: cargo build --release --locked -p xai-grok-pager-bin

      - name: Smoke-run
        run: ./target/release/xai-grok-pager --version

      # The cargo artifact keeps its internal name; ship it under the
      # user-facing `grok` name, matching the official installer.
      - name: Rename to grok
        run: cp target/release/xai-grok-pager target/release/grok

      - name: Configure Apple code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "::error::Apple code-signing secrets are not configured. See .github/APPLE_CODE_SIGNING.md."
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/apple-developer-id.p12"
          keychain_path="$RUNNER_TEMP/apple-code-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY does not match the imported certificate."
            exit 1
          fi

          rm -f "$certificate_path"

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          codesign \
            --force \
            --keychain "$APPLE_KEYCHAIN_PATH" \
            --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            target/release/grok
          codesign --verify --strict --verbose=2 target/release/grok

          signature_details="$RUNNER_TEMP/grok.codesign.txt"
          codesign -dvv target/release/grok 2>&1 | tee "$signature_details"
          grep -Fq "Authority=$APPLE_SIGNING_IDENTITY" "$signature_details"
          grep -Fq 'TeamIdentifier=6F8LHK4H5P' "$signature_details"

      - name: Remove Apple code-signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -n "${APPLE_CERTIFICATE_PATH:-}" ]]; then
            rm -f "$APPLE_CERTIFICATE_PATH"
          fi
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: grok-${{ matrix.name }}
          path: target/release/grok
          if-no-files-found: error
